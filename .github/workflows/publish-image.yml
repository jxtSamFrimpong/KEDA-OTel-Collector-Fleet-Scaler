name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "pkg/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/publish-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jxtsamfrimpong/keda-otel-collector-fleet-scaler

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Artifact Hub's Trivy path maps GHCR MANIFEST_UNKNOWN to "image not found".
          # Default Buildx emits an OCI index (+ provenance unknown/unknown). Clients
          # that omit OCI Accept headers get: "OCI index found, but Accept header does
          # not support OCI indexes". Docker media types + no attestations avoid that.
          provenance: false
          sbom: false
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
