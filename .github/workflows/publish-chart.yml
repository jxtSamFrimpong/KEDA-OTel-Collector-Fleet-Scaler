name: Publish chart

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_OCI: oci://ghcr.io/jxtsamfrimpong/charts
  CHART_PACKAGE: ghcr.io/jxtsamfrimpong/charts/keda-otel-collector-fleet-scaler

permissions:
  contents: read

jobs:
  publish:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install Oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR (Oras)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/keda-otel-collector-fleet-scaler -d dist
          ls -la dist

      - name: Push chart to OCI
        run: |
          chart_tgz="$(ls dist/keda-otel-collector-fleet-scaler-*.tgz | head -n1)"
          helm push "${chart_tgz}" "${{ env.CHART_OCI }}"

      - name: Push Artifact Hub repository metadata
        run: |
          oras push "${{ env.CHART_PACKAGE }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
