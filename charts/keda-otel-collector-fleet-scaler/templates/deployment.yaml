apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keda-otel-collector-fleet-scaler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "keda-otel-collector-fleet-scaler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keda-otel-collector-fleet-scaler.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "keda-otel-collector-fleet-scaler.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "keda-otel-collector-fleet-scaler.serviceAccountName" . }}
      containers:
        - name: scaler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -grpc-addr=:{{ .Values.service.grpcPort }}
            - -http-addr=:{{ .Values.service.httpPort }}
            - -log-level=info
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
