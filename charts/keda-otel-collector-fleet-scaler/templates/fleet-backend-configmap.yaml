{{- if .Values.fleet.enabled }}
{{- $profile := include "keda-otel-collector-fleet-scaler.profile" . -}}
{{- $exporter := .Values.fleet.backend.exporter | default "datadog" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keda-otel-collector-fleet-scaler.backendName" . }}-config
  namespace: {{ include "keda-otel-collector-fleet-scaler.fleetNamespace" . }}
  labels:
    {{- include "keda-otel-collector-fleet-scaler.backendLabels" . | nindent 4 }}
data:
  collector.yaml: |
{{- if .Values.fleet.backend.config }}
{{ tpl .Values.fleet.backend.config . | nindent 4 }}
{{- else if eq $exporter "debug" }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 1024
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
{{- else if eq $profile "stateful" }}
    # Stateful backend with tail sampling (decision_wait ≤ profile preStop).
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1536
        spike_limit_mib: 384
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 1000
        policies:
          - name: errors-and-high-latency
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: probabilistic
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        send_batch_size: 2048
        timeout: 5s
    exporters:
      datadog:
        api:
          site: {{ .Values.fleet.datadog.site | quote }}
          key: ${env:DD_API_KEY}
        sending_queue:
          enabled: true
          num_consumers: 20
          queue_size: 1000
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [datadog]
{{- else }}
    # Stateless forward backend (fleet profile: forward).
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256
      batch:
        send_batch_size: 2048
        timeout: 5s
    exporters:
      datadog:
        api:
          site: {{ .Values.fleet.datadog.site | quote }}
          key: ${env:DD_API_KEY}
        sending_queue:
          enabled: true
          num_consumers: 20
          queue_size: 1000
        retry_on_failure:
          enabled: true
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [datadog]
{{- end }}
{{- end }}
