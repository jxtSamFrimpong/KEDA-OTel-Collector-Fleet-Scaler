{{- /* dig (not default): Sprig default treats false as empty and would ignore create=false */ -}}
{{- if and .Values.fleet.enabled (dig "create" true .Values.fleet.gateway.service) }}
# Gateway Service: ClusterIP by default (BYO-compatible). Set type=LoadBalancer
# + annotations for a dedicated AWS LBC NLB / GCP / Azure LB.
# Never expose scaler :9090 here. Prefer TargetGroupBinding for reuse of an
# existing NLB (fleet.gateway.targetGroupBinding).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keda-otel-collector-fleet-scaler.gatewayName" . }}
  namespace: {{ include "keda-otel-collector-fleet-scaler.fleetNamespace" . }}
  labels:
    {{- include "keda-otel-collector-fleet-scaler.gatewayLabels" . | nindent 4 }}
  {{- with .Values.fleet.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.fleet.gateway.service.type }}
  {{- if and (eq .Values.fleet.gateway.service.type "LoadBalancer") .Values.fleet.gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.fleet.gateway.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "keda-otel-collector-fleet-scaler.gatewayName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.fleet.gateway.service.otlpGrpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.fleet.gateway.service.otlpHttpPort }}
      targetPort: otlp-http
{{- end }}
