apiVersion: v2
name: keda-otel-collector-fleet-scaler
description: KEDA external scaler for OpenTelemetry collector fleets (TraceID gateway pattern)
type: application
version: 0.2.0
# Scaler container image tag (unchanged; fleet templates are chart-only).
appVersion: "0.1.1"
keywords:
  - keda
  - opentelemetry
  - autoscaling
  - otel
home: https://github.com/jxtSamFrimpong/KEDA-OTel-Collector-Fleet-Scaler
maintainers:
  - name: jxtSamFrimpong
sources:
  - https://github.com/jxtSamFrimpong/KEDA-OTel-Collector-Fleet-Scaler
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/jxtSamFrimpong/KEDA-OTel-Collector-Fleet-Scaler
    - name: support
      url: https://github.com/jxtSamFrimpong/KEDA-OTel-Collector-Fleet-Scaler/issues
  artifacthub.io/images: |
    - name: scaler
      image: ghcr.io/jxtsamfrimpong/keda-otel-collector-fleet-scaler:0.1.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: added
      description: Optional in-chart fleet (gateway, backends, ConfigMaps, gateway RBAC, ScaledObject) gated by fleet.enabled
    - kind: added
      description: Gateway Service supports ClusterIP or LoadBalancer with configurable annotations (AWS LBC NLB)
    - kind: changed
      description: kustomize deploy/examples remain reference-only; Helm is the primary fleet deploy path
