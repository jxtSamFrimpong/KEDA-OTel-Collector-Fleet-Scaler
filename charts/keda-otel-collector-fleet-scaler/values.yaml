# Default values for keda-otel-collector-fleet-scaler.

image:
  repository: keda-otel-collector-fleet-scaler
  tag: "dev"
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: keda-otel-collector-fleet-scaler

service:
  grpcPort: 9090
  httpPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

rbac:
  create: true

# Optional reference fleet. Disabled by default — enable for a turnkey demo.
fleet:
  enabled: false
  profile: forward # forward | stateful
  namespace: observability

  gateway:
    replicas: 2
    image: otel/opentelemetry-collector-contrib:0.114.0

  backend:
    # kind/preStop overridden by profile when left empty / zero
    kind: ""
    preStopSeconds: 0
    terminationGracePeriodSeconds: 0
    image: otel/opentelemetry-collector-contrib:0.114.0
    minReplicas: 2
    maxReplicas: 20

  scalerTrigger:
    metric: exporter_queue_utilization
    targetValue: "0.65"
    aggregation: avg
    activationThreshold: "0.05"

  datadog:
    secretName: datadog-secret
    secretKey: api-key
