# Default values for keda-otel-collector-fleet-scaler.

image:
  repository: keda-otel-collector-fleet-scaler
  tag: "dev"
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: keda-otel-collector-fleet-scaler

service:
  grpcPort: 9090
  httpPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

rbac:
  create: true

# Optional reference fleet. Disabled by default — enable for a turnkey demo.
fleet:
  enabled: false
  profile: forward # forward | stateful
  namespace: observability

  gateway:
    replicas: 2
    image: otel/opentelemetry-collector-contrib:0.114.0
    # Gateway OTLP Service (future fleet templates). Today the primary path is the
    # kustomize overlay: deploy/examples/external-lb
    # Never put scaler ports here — OTLP 4317/4318 only.
    service:
      type: ClusterIP # set LoadBalancer for external OTLP clients
      annotations: {}
      # Examples (when type=LoadBalancer):
      # annotations:
      #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
      #   cloud.google.com/load-balancer-type: "Internal"
      #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      loadBalancerSourceRanges: []
      # loadBalancerSourceRanges: ["10.0.0.0/8"]
      otlpGrpcPort: 4317
      otlpHttpPort: 4318


  backend:
    # kind/preStop overridden by profile when left empty / zero
    kind: ""
    preStopSeconds: 0
    terminationGracePeriodSeconds: 0
    image: otel/opentelemetry-collector-contrib:0.114.0
    minReplicas: 2
    maxReplicas: 20

  scalerTrigger:
    metric: exporter_queue_utilization
    targetValue: "0.65"
    aggregation: avg
    activationThreshold: "0.05"

  datadog:
    secretName: datadog-secret
    secretKey: api-key
