apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-otel-collector-fleet-scaler
  namespace: observability
  labels:
    app.kubernetes.io/name: keda-otel-collector-fleet-scaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-otel-collector-fleet-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-otel-collector-fleet-scaler
    spec:
      serviceAccountName: keda-otel-collector-fleet-scaler
      containers:
        - name: scaler
          image: ghcr.io/hubtel/keda-otel-collector-fleet-scaler:dev
          imagePullPolicy: IfNotPresent
          args:
            - -grpc-addr=:9090
            - -http-addr=:8080
            - -log-level=info
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keda-otel-collector-fleet-scaler
  namespace: observability
  labels:
    app.kubernetes.io/name: keda-otel-collector-fleet-scaler
spec:
  selector:
    app.kubernetes.io/name: keda-otel-collector-fleet-scaler
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
